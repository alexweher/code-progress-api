services:
  postgres:
    image: postgres:17-alpine
    container_name: codeprogress-postgres
    environment:
      POSTGRES_DB: codeprogress
      POSTGRES_USER: codeprogress
      POSTGRES_PASSWORD: codeprogress
    ports:
      - "5433:5432"
    volumes:
      - codeprogress-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeprogress -d codeprogress"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  codeprogress-postgres-data:
