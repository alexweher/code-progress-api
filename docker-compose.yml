services:
  postgres:
    image: postgres:17-alpine
    container_name: codeprogress-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeprogress}
      POSTGRES_USER: ${POSTGRES_USER:-codeprogress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - codeprogress-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeprogress-backend:local
    container_name: codeprogress-backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codeprogress}
      DB_USERNAME: ${POSTGRES_USER:-codeprogress}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      JWT_SECRET: ${JWT_SECRET:?Create .env from .env.example and set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-codeprogress-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT1H}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped

volumes:
  codeprogress-postgres-data:
