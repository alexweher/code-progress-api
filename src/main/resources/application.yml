spring:
  application:
    name: CodeProgress

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/codeprogress}
    username: ${DB_USERNAME:codeprogress}
    password: ${DB_PASSWORD:codeprogress}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  time-zone: ${APP_TIME_ZONE:UTC}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:codeprogress-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
