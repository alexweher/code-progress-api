spring:
  application:
    name: CodeProgress

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/codeprogress}
    username: ${DB_USERNAME:codeprogress}
    password: ${DB_PASSWORD:codeprogress}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}